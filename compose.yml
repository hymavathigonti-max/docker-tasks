services:
  web:
    build: .
    image: appimage
    container_name: app-cont
    env_file:
      - .env
    ports:
      - "1234:8080"
    networks:
      - mynetworks
    volumes:
      - myappvolume:/hyma
    depends_on:
      - db
    restart: on-failure
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 256M
        limits:
          cpus: "1"
          memory: 512M

  db:
    build: ./Docker-db
    image: dbimage
    container_name: db-cont
    env_file:
      - .env
    ports:
      - "3306:3306"
    networks:
      mynetworks:
        aliases:
          - devopsdb
    volumes:
      - mydbvolume:/var/lib/mysql
    restart: on-failure
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 256M
        limits:
          cpus: "1"
          memory: 512M

volumes:
  myappvolume:
  mydbvolume:

networks:
  mynetworks:
    driver: bridge
